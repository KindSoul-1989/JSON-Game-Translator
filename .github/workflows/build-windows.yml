name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JSON_Game_Translator json_translator_windows.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSON_Game_Translator-Windows
          path: dist/JSON_Game_Translator.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "dist/JSON_Game_Translator.exe" --title "JSON Game Translator ${{ github.ref_name }}" --generate-notes
