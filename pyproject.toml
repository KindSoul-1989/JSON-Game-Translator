[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json-game-translator"
version = "1.0.0"
description = "Open-source GUI translator for game localization JSON files"
requires-python = ">=3.12"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "JSON Game Translator contributors"}]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
